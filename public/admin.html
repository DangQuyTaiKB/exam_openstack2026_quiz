<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kết quả thi</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f5f0;--surface:#fff;--border:#e2e0d8;--border2:#c8c6bc;
    --text:#1a1a18;--text2:#6b6a64;--text3:#9b9a94;
    --green-bg:#f0fdf4;--green-border:#bbf7d0;--green-text:#15803d;
    --red-bg:#fef2f2;--red-border:#fecaca;--red-text:#dc2626;
    --blue-bg:#eff6ff;--blue-text:#1d4ed8;
    --radius:10px;--radius-sm:7px;
  }
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--text)}
  .container{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
  h1{font-size:20px;font-weight:600;margin-bottom:.25rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
  input[type=password],input[type=text]{width:100%;padding:9px 13px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;color:var(--text);background:var(--surface);outline:none}
  input:focus{border-color:#6366f1}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:background .12s}
  .btn:hover{background:var(--bg)}
  .btn.primary{background:#1a1a18;color:#fff;border-color:transparent}
  .btn.primary:hover{opacity:.85}
  .btn.green{border-color:var(--green-border);color:var(--green-text)}
  .btn.green:hover{background:var(--green-bg)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1rem}
  .stat-card{background:var(--bg);border-radius:var(--radius-sm);padding:.85rem 1rem}
  .stat-label{font-size:12px;color:var(--text2);margin-bottom:.25rem}
  .stat-val{font-size:24px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead tr{border-bottom:2px solid var(--border2)}
  th{text-align:left;padding:8px 10px;font-weight:500;color:var(--text2);font-size:12px;letter-spacing:.3px}
  td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
  tr:last-child td{border:none}
  tr:hover td{background:var(--bg)}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
  .badge.pass{background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)}
  .badge.fail{background:var(--red-bg);color:var(--red-text);border:1px solid var(--red-border)}
  .screen{display:none}.screen.active{display:block}
  .error{color:var(--red-text);font-size:13px;margin-top:.4rem;display:none}
  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
  .sort-active{font-weight:600;color:var(--text)}
  .rank-1{color:#b8860b;font-weight:700}
  .rank-2{color:#6b6a64;font-weight:600}
  .rank-3{color:#8b6340;font-weight:600}
  #no-data{text-align:center;padding:2rem;color:var(--text2);display:none}
  .filter-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .filter-row label{font-size:13px;color:var(--text2)}
</style>
</head>
<body>
<div class="container">

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div style="max-width:360px;margin:4rem auto">
    <div class="card">
      <div style="text-align:center;margin-bottom:1.25rem">
        <div style="font-size:28px;margin-bottom:.5rem">🔒</div>
        <h1>Trang quản trị</h1>
        <p style="font-size:13px;color:var(--text2);margin-top:.25rem">Xem và xuất kết quả thi</p>
      </div>
      <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:.35rem">Mật khẩu admin</label>
      <input type="password" id="pw-input" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter')doLogin()" />
      <div id="pw-error" class="error">Sai mật khẩu. Vui lòng thử lại.</div>
      <button class="btn primary" style="margin-top:.85rem;width:100%;justify-content:center" onclick="doLogin()">Đăng nhập</button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="screen-dash" class="screen">
  <div class="toolbar">
    <div>
      <h1>📊 Kết quả kỳ thi</h1>
      <p style="font-size:13px;color:var(--text2)" id="session-name-label"></p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <button class="btn green" onclick="exportCSV()">⬇️ Xuất CSV</button>
      <button class="btn" onclick="loadResults()">🔄 Làm mới</button>
      <button class="btn" onclick="doLogout()" style="border-color:var(--red-border);color:var(--red-text)">Đăng xuất</button>
    </div>
  </div>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="card" style="overflow-x:auto">
    <div class="toolbar" style="margin-bottom:.75rem">
      <div style="font-size:14px;font-weight:500">Danh sách thí sinh</div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input type="text" id="search-input" placeholder="🔍 Tìm tên..." style="width:180px;padding:6px 10px;font-size:13px" oninput="filterTable()" />
        <select id="sort-select" style="padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text)" onchange="sortTable()">
          <option value="time_desc">Mới nhất</option>
          <option value="score_desc">Điểm cao → thấp</option>
          <option value="score_asc">Điểm thấp → cao</option>
          <option value="name_asc">Tên A–Z</option>
        </select>
      </div>
    </div>
    <table id="results-table">
      <thead><tr>
        <th>#</th><th>Họ tên</th><th>Điểm</th><th>Đúng/Tổng</th><th>Thời gian làm</th><th>Nộp lúc</th><th>Xếp loại</th>
      </tr></thead>
      <tbody id="results-body"></tbody>
    </table>
    <div id="no-data">Chưa có dữ liệu hoặc không tìm thấy thí sinh.</div>
  </div>
</div>

</div>
<script>
let password = "";
let allResults = [];

function doLogin() {
  password = document.getElementById("pw-input").value;
  if (!password) return;
  loadResults();
}

async function loadResults() {
  try {
    const res = await fetch("/api/admin/results?password=" + encodeURIComponent(password));
    if (res.status === 401) {
      document.getElementById("pw-error").style.display = "block";
      return;
    }
    const data = await res.json();
    allResults = data.results;
    document.getElementById("pw-error").style.display = "none";
    renderDash();
    goScreen("screen-dash");
  } catch(e) {
    alert("Lỗi kết nối server.");
  }
}

function renderDash() {
  if (allResults.length > 0) {
    document.getElementById("session-name-label").textContent =
      "Kỳ thi: " + allResults[0].session_name;
  }
  const scores = allResults.map(r => r.score);
  const passCount = allResults.filter(r => r.score >= 5).length;
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : "—";
  const max = scores.length ? Math.max(...scores) : "—";
  const min = scores.length ? Math.min(...scores) : "—";
  document.getElementById("stats-grid").innerHTML = `
    <div class="stat-card"><div class="stat-label">Tổng thí sinh</div><div class="stat-val">${allResults.length}</div></div>
    <div class="stat-card"><div class="stat-label">Điểm trung bình</div><div class="stat-val">${avg}</div></div>
    <div class="stat-card"><div class="stat-label">Điểm cao nhất</div><div class="stat-val">${max}</div></div>
    <div class="stat-card"><div class="stat-label">Điểm thấp nhất</div><div class="stat-val">${min}</div></div>
    <div class="stat-card"><div class="stat-label">Tỷ lệ đạt</div><div class="stat-val">${scores.length ? Math.round(passCount/scores.length*100)+"%" : "—"}</div></div>
  `;
  renderTable(allResults);
}

function renderTable(data) {
  const tbody = document.getElementById("results-body");
  const noData = document.getElementById("no-data");
  if (data.length === 0) { tbody.innerHTML = ""; noData.style.display = "block"; return; }
  noData.style.display = "none";

  // Sort by score desc for rank
  const ranked = [...allResults].sort((a,b) => b.score - a.score);

  tbody.innerHTML = data.map((r, i) => {
    const rank = ranked.indexOf(r) + 1;
    const rankStr = rank === 1 ? '<span class="rank-1">🥇 ' + rank + '</span>'
      : rank === 2 ? '<span class="rank-2">🥈 ' + rank + '</span>'
      : rank === 3 ? '<span class="rank-3">🥉 ' + rank + '</span>'
      : rank;
    const pass = r.score >= 5;
    const mins = Math.floor(r.duration_seconds / 60);
    const secs = r.duration_seconds % 60;
    const timeStr = new Date(r.submitted_at).toLocaleString("vi-VN");
    return `<tr>
      <td>${rankStr}</td>
      <td style="font-weight:500">${r.student_name}</td>
      <td style="font-weight:600;font-size:15px">${r.score}</td>
      <td style="color:var(--text2)">${r.correct}/${r.total}</td>
      <td style="color:var(--text2)">${mins}p ${secs}s</td>
      <td style="color:var(--text2)">${timeStr}</td>
      <td><span class="badge ${pass?'pass':'fail'}">${pass?'✓ Đạt':'✗ Chưa đạt'}</span></td>
    </tr>`;
  }).join("");
}

function filterTable() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const filtered = allResults.filter(r => r.student_name.toLowerCase().includes(q));
  sortAndRender(filtered);
}

function sortTable() { sortAndRender(getFiltered()); }

function getFiltered() {
  const q = document.getElementById("search-input").value.toLowerCase();
  return allResults.filter(r => r.student_name.toLowerCase().includes(q));
}

function sortAndRender(data) {
  const s = document.getElementById("sort-select").value;
  const sorted = [...data].sort((a,b) => {
    if (s === "score_desc") return b.score - a.score;
    if (s === "score_asc") return a.score - b.score;
    if (s === "name_asc") return a.student_name.localeCompare(b.student_name, "vi");
    return new Date(b.submitted_at) - new Date(a.submitted_at);
  });
  renderTable(sorted);
}

async function exportCSV() {
  window.location.href = "/api/admin/export-csv?password=" + encodeURIComponent(password);
}

function doLogout() {
  password = ""; allResults = [];
  document.getElementById("pw-input").value = "";
  goScreen("screen-login");
}

function goScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>
</body>
</html>
